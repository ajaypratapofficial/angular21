<h2>My Cart</h2>

@if (cartService.cart().length === 0) {

  <p>Your cart is empty.</p>

} @else {

  @for (product of cartService.cart(); track product.id) {

    <div class="cart-item">

      <h3>{{ product.name }}</h3>

      <p>₹{{ product.price }}</p>

      <button (click)="cartService.removeFromCart(product.id)">
        Remove
      </button>

    </div>

  }

  <br>

  <button (click)="cartService.clearCart()">
    Clear Cart
  </button>

}
