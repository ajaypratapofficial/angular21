<form [formGroup]="form" (ngSubmit)="submitForm()">

  <label>Name</label>

  <input
    type="text"
    formControlName="name"
  >

  <h3>Skills</h3>

  <div formArrayName="skills">

    @for (skill of skills.controls; track $index) {

      <input [formControlName]="$index">

      <button
        type="button"
        (click)="removeSkill($index)"
      >
        Remove
      </button>

      <br><br>

    }

  </div>

  <button
    type="button"
    (click)="addSkill()"
  >
    Add Skill
  </button>

  <br><br>

  <button type="submit">
    Submit
  </button>

</form>
