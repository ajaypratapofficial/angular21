<h2>Products</h2>

<div class="products">

  @for (product of products; track product.id) {

    <div class="product-card">

      <img
        [src]="product.image"
        [alt]="product.name"
      >

      <h3>{{ product.name }}</h3>

      <p>₹{{ product.price }}</p>

      <button (click)="addToCart(product)">
        Add to Cart
      </button>

    </div>

  }

</div>
